name: Node.js Package

on:
  push:
    branches:
      - master

# Use the filtered operating-system roots for Node and npm in every job.
env:
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
  SSL_CERT_DIR: /tmp/emudhra-empty-ca

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Remove compromised CA trust paths
        run: |
          sudo sed -i -e '/^mozilla\/emSign_ECC_Root_CA_-_G3.crt$/s/^/!/' \
            -e '/^mozilla\/emSign_Root_TLS_CA_-_G3.crt$/s/^/!/' \
            -e '/^mozilla\/Comodo_AAA_Services_root.crt$/s/^/!/' /etc/ca-certificates.conf
          sudo update-ca-certificates --fresh
          mkdir -p "$SSL_CERT_DIR"
          node -e 'const fs=require("node:fs"); const {X509Certificate}=require("node:crypto"); const roots=fs.readFileSync(process.env.SSL_CERT_FILE,"utf8").match(/-----BEGIN CERTIFICATE-----[\s\S]+?-----END CERTIFICATE-----/g)||[]; if(roots.length<100 || roots.some(p=>/CN=(emSign ECC Root CA - G3|emSign Root TLS CA - G3|AAA Certificate Services)(\n|$)/.test(new X509Certificate(p).subject))) throw Error("Unmitigated default TLS trust store")'
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 12

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Remove compromised CA trust paths
        run: |
          sudo sed -i -e '/^mozilla\/emSign_ECC_Root_CA_-_G3.crt$/s/^/!/' \
            -e '/^mozilla\/emSign_Root_TLS_CA_-_G3.crt$/s/^/!/' \
            -e '/^mozilla\/Comodo_AAA_Services_root.crt$/s/^/!/' /etc/ca-certificates.conf
          sudo update-ca-certificates --fresh
          mkdir -p "$SSL_CERT_DIR"
          node -e 'const fs=require("node:fs"); const {X509Certificate}=require("node:crypto"); const roots=fs.readFileSync(process.env.SSL_CERT_FILE,"utf8").match(/-----BEGIN CERTIFICATE-----[\s\S]+?-----END CERTIFICATE-----/g)||[]; if(roots.length<100 || roots.some(p=>/CN=(emSign ECC Root CA - G3|emSign Root TLS CA - G3|AAA Certificate Services)(\n|$)/.test(new X509Certificate(p).subject))) throw Error("Unmitigated default TLS trust store")'
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 12
          registry-url: https://registry.npmjs.org/
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.npm_token}}
